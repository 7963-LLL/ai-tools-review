<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#4facfe" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
  </g>

  <!-- Central GPU chip die -->
  <rect x="440" y="230" width="320" height="220" rx="18" fill="#111827" stroke="url(#accent1)" stroke-width="2" filter="url(#neon)"/>
  <rect x="460" y="250" width="280" height="180" rx="10" fill="#1a1f3a" stroke="#2d3a6e" stroke-width="1" opacity="0.8"/>

  <!-- Chip inner circuitry -->
  <g stroke="#4facfe" stroke-width="0.8" opacity="0.5" fill="none">
    <rect x="480" y="270" width="50" height="40" rx="4"/>
    <rect x="545" y="270" width="50" height="40" rx="4"/>
    <rect x="610" y="270" width="50" height="40" rx="4"/>
    <rect x="675" y="270" width="50" height="40" rx="4"/>
    <rect x="480" y="330" width="50" height="40" rx="4"/>
    <rect x="545" y="330" width="50" height="40" rx="4"/>
    <rect x="610" y="330" width="50" height="40" rx="4"/>
    <rect x="675" y="330" width="50" height="40" rx="4"/>
    <rect x="480" y="390" width="50" height="20" rx="4"/>
    <rect x="545" y="390" width="50" height="20" rx="4"/>
    <rect x="610" y="390" width="50" height="20" rx="4"/>
    <rect x="675" y="390" width="50" height="20" rx="4"/>
  </g>

  <!-- Glowing core -->
  <circle cx="600" cy="340" r="25" fill="url(#accent1)" opacity="0.15" filter="url(#glowFilter)"/>
  <circle cx="600" cy="340" r="10" fill="url(#accent1)" opacity="0.4"/>
  <circle cx="600" cy="340" r="4" fill="#fff" opacity="0.8"/>

  <!-- Data flow lines - supply side (from left) -->
  <g filter="url(#neon)">
    <line x1="60" y1="300" x2="440" y2="340" stroke="url(#accent1)" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
    <circle cx="60" cy="300" r="5" fill="url(#accent1)"/>
    <circle cx="160" cy="310" r="3" fill="url(#accent1)" opacity="0.6"/>
    <circle cx="260" cy="320" r="3" fill="url(#accent1)" opacity="0.6"/>
    <circle cx="360" cy="330" r="3" fill="url(#accent1)" opacity="0.6"/>
  </g>

  <!-- Data flow lines - demand side (to right) -->
  <g filter="url(#neon)">
    <line x1="760" y1="340" x2="1140" y2="380" stroke="url(#accent2)" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
    <circle cx="1140" cy="380" r="5" fill="url(#accent2)"/>
    <circle cx="1040" cy="370" r="3" fill="url(#accent2)" opacity="0.6"/>
    <circle cx="940" cy="360" r="3" fill="url(#accent2)" opacity="0.6"/>
    <circle cx="840" cy="350" r="3" fill="url(#accent2)" opacity="0.6"/>
  </g>

  <!-- Globe / demand nodes -->
  <circle cx="1050" cy="150" r="50" fill="none" stroke="url(#accent2)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="1050" cy="150" r="30" fill="none" stroke="url(#accent2)" stroke-width="1" opacity="0.5"/>
  <circle cx="1050" cy="150" r="12" fill="url(#accent2)" opacity="0.4"/>

  <!-- Demand arrows spreading -->
  <g stroke="url(#accent2)" stroke-width="1.2" opacity="0.5">
    <line x1="1100" y1="150" x2="1160" y2="120"/>
    <line x1="1100" y1="150" x2="1160" y2="170"/>
    <line x1="1100" y1="150" x2="1160" y2="145"/>
  </g>

  <!-- Label chips floating -->
  <rect x="90" y="140" width="110" height="36" rx="6" fill="#1a1f3a" stroke="#4facfe" stroke-width="1" opacity="0.7"/>
  <text x="145" y="163" text-anchor="middle" fill="#4facfe" font-size="13" font-family="Arial,sans-serif" font-weight="600">SUPPLY</text>
  <rect x="1000" y="480" width="110" height="36" rx="6" fill="#1a1f3a" stroke="#fa709a" stroke-width="1" opacity="0.7"/>
  <text x="1055" y="503" text-anchor="middle" fill="#fa709a" font-size="13" font-family="Arial,sans-serif" font-weight="600">DEMAND</text>

  <!-- Demand bars (right side) -->
  <g opacity="0.6">
    <rect x="950" y="520" width="14" height="50" rx="2" fill="url(#accent2)" opacity="0.5">
      <animate attributeName="height" values="50;70;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="520;500;520" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="975" y="510" width="14" height="60" rx="2" fill="url(#accent2)" opacity="0.6">
      <animate attributeName="height" values="60;85;60" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="510;485;510" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="500" width="14" height="70" rx="2" fill="url(#accent2)" opacity="0.7">
      <animate attributeName="height" values="70;95;70" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="500;475;500" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1025" y="515" width="14" height="55" rx="2" fill="url(#accent2)" opacity="0.5">
      <animate attributeName="height" values="55;78;55" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="515;492;515" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1050" y="490" width="14" height="80" rx="2" fill="url(#accent2)" opacity="0.8">
      <animate attributeName="height" values="80;110;80" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="490;460;490" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Animated dotted particles -->
  <circle cx="200" cy="450" r="2" fill="#4facfe" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="480" r="1.5" fill="#4facfe" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="420" r="2" fill="#fa709a" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="200" r="1.5" fill="#4facfe" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom title -->
  <text x="600" y="620" text-anchor="middle" fill="#4facfe" font-size="16" font-family="Arial,sans-serif" font-weight="700" letter-spacing="4" opacity="0.5">AI CHIP SUPPLY &amp; DEMAND</text>
</svg>